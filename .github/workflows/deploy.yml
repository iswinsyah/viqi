name: Auto Deploy to Hostinger

# Trigger deploy otomatis setiap ada push ke branch 'main'
on:
  push:
    branches:
      - main
  # Mengizinkan deploy dijalankan secara manual dari tab Actions GitHub
  workflow_dispatch:

jobs:
  web-deploy:
    name: ⚡ Fast Delta Deploy
    runs-on: ubuntu-latest
    steps:
    - name: 🚚 Get latest code with git history
      uses: actions/checkout@v4
      with:
        fetch-depth: 2

    - name: 🚀 Sync only changed files to Hostinger via SFTP
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        port: 65002
        protocol: sftp
        server-dir: 'domains/villaquranindonesia.com/public_html/'
        exclude: |
          **/.git*
          **/.git*/**
          **/.github/**
          **/.agents/**
          **/scratch/**
          **/agent_*_log.txt
          **/saved_*.txt
          **/autopilot_status.txt
          **/config-key.php
          **/.gitignore
