name: Auto Deploy to Hostinger

on:
  push:
    branches:
      - main 
  workflow_dispatch:

jobs:
  web-deploy:
    name: 🎉 Fast Delta Deploy to Hostinger
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - name: 🚚 Get latest code
      uses: actions/checkout@v4
      with:
        fetch-depth: 2
    
    - name: ⚡ Fast Sync to villaquranbaronmalang.com
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      continue-on-error: true
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        protocol: ftp
        port: 21
        server-dir: domains/villaquranbaronmalang.com/public_html/
        exclude: |
          **/.git*
          **/.git*/**
          **/.github/**
          **/.agents/**
          **/node_modules/**
          **/upload/**
          **/uploads/**
          **/assets/**
          **/fonts/**

    - name: ⚡ Fast Sync to villaquranindonesia.com
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      continue-on-error: true
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        protocol: ftp
        port: 21
        server-dir: domains/villaquranindonesia.com/public_html/
        exclude: |
          **/.git*
          **/.git*/**
          **/.github/**
          **/.agents/**
          **/node_modules/**
          **/upload/**
          **/uploads/**
          **/assets/**
          **/fonts/**

    - name: ⚡ Fast Sync to Root public_html
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      continue-on-error: true
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        protocol: ftp
        port: 21
        server-dir: public_html/
        exclude: |
          **/.git*
          **/.git*/**
          **/.github/**
          **/.agents/**
          **/node_modules/**
          **/upload/**
          **/uploads/**
          **/assets/**
          **/fonts/**
