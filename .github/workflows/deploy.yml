name: Auto Deploy to Hostinger

# Trigger deploy otomatis setiap ada push ke branch 'main'
on:
  push:
    branches:
      - main 
  workflow_dispatch:

jobs:
  web-deploy:
    name: 🎉 Fast Delta Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
    - name: 🚚 Get latest code
      uses: actions/checkout@v4
      with:
        fetch-depth: 2
    
    - name: ⚡ Fast Sync files to Hostinger
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        protocol: ftp
        port: 21
        server-dir: domains/villaquranindonesia.com/public_html/
        exclude: |
          **/.git*
          **/.git*/**
          **/.github/**
          **/.agents/**
