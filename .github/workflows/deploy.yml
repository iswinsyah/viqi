name: Auto Deploy to Hostinger

on:
  push:
    branches:
      - main 
  workflow_dispatch:

jobs:
  deploy:
    name: 🚀 Fast Deploy to Hostinger (villaquranindonesia.com)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 🚚 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚡ SFTP Sync (Port 65002)
        uses: wlixcc/SFTP-Deploy-Action@v1.2.6
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 65002
          local_path: './'
          remote_path: 'domains/villaquranindonesia.com/public_html'
          sftpArgs: '-o ConnectTimeout=30'
          rsyncArgs: '--exclude=.git --exclude=.github --exclude=.agents --exclude=upload --exclude=uploads --exclude=assets --exclude=fonts --exclude=*.mp3'
